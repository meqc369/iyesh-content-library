limit_req_zone $binary_remote_addr zone=iyesh_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=iyesh_admin:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name iyesh.com www.iyesh.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~* \.(?:mjs|env|sql|tgz|log)$ { return 404; }
    location / { return 301 https://iyesh.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.iyesh.com;
    ssl_certificate /etc/nginx/ssl/iyesh.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/iyesh.com.key;
    return 301 https://iyesh.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name iyesh.com;

    root /var/www/iyesh-h5;
    index index.html;
    client_max_body_size 25m;
    ssl_certificate /etc/nginx/ssl/iyesh.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/iyesh.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:iyesh_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    sendfile on;
    keepalive_timeout 30;

    location = /admin.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /admin-login.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ^~ /api/v1/admin/ {
        limit_req zone=iyesh_admin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        limit_req zone=iyesh_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        alias /opt/iyesh/server/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~* \.(?:mjs|env|sql|tgz|log)$ { return 404; }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
