<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#13213b">
  <meta name="format-detection" content="telephone=no">
  <title>登录 / 注册 · 月入万刀</title>
  <link rel="icon" type="image/png" href="assets/iyesh-favicon.png">
  <link rel="stylesheet" href="styles.css?v=20261024r1">
</head>
<body data-page="login" data-skip-me>
  <div class="auth-page">
    <section class="band auth-brand">
      <a class="brand" href="index.html" aria-label="返回月入万刀首页"><img src="assets/iyesh-logo.webp" alt="" width="32" height="32"><span>月入万刀</span></a>
      <div>
        <h1>把经验，变成<br>可复用的增长。</h1>
        <p class="motto" data-daily-quote style="margin-top:14px"><span data-quote-text>把复杂的事做简单。</span></p>
      </div>
      <ul>
        <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span>按方向、技能和时间，找到能直接复制的 YouTube 打法</span></li>
        <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span>收藏与常用筛选，换设备也能接着看</span></li>
        <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span>发布你的案例，收获积分打赏与内容收入</span></li>
      </ul>
    </section>

    <main class="auth-main">
      <div class="auth-card">
        <h2 id="authTitle">欢迎回来</h2>
        <p id="authSubtitle">登录后继续阅读、收藏和发布内容</p>
        <div class="segmented" role="tablist" aria-label="登录或注册" id="modeTabs">
          <button type="button" role="tab" data-mode="login" aria-selected="true">登录</button>
          <button type="button" role="tab" data-mode="register" aria-selected="false">注册</button>
        </div>
        <div class="inline-alert inline-alert--info" id="refNotice" hidden style="margin-bottom:16px"></div>

        <form class="auth-form" id="loginForm" novalidate>
          <div class="field"><label class="label" for="loginId">用户名或邮箱</label><input class="input" id="loginId" name="identifier" autocomplete="username" autocapitalize="off" spellcheck="false" required placeholder="输入用户名或邮箱"></div>
          <div class="field"><label class="label" for="loginPassword">密码</label><div class="password-wrap"><input class="input" id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="输入密码"><button type="button" data-toggle-password aria-label="显示密码" data-icon="eye"></button></div></div>
          <div class="row"><label class="check"><input name="remember" type="checkbox" checked> 30 天内保持登录</label><button class="text-btn" type="button" data-mode="reset">忘记密码？</button></div>
          <button class="btn btn--primary btn--lg btn--block" type="submit">登录</button>
        </form>

        <form class="auth-form" id="registerForm" novalidate hidden>
          <div class="field"><label class="label" for="regName">用户名</label><input class="input" id="regName" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" minlength="3" maxlength="24" required placeholder="3–24 位中文、字母或数字"></div>
          <div class="field"><label class="label" for="regEmail">邮箱</label><input class="input" id="regEmail" name="email" type="email" inputmode="email" autocomplete="email" required placeholder="用于接收验证码和找回密码"></div>
          <div class="field"><label class="label" for="regCode">邮箱验证码</label><div class="input-group"><input class="input num" id="regCode" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required placeholder="6 位数字"><button class="btn" type="button" data-send-code="register">获取验证码</button></div></div>
          <div class="field"><label class="label" for="regPassword">设置密码</label><div class="password-wrap"><input class="input" id="regPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="至少 8 位"><button type="button" data-toggle-password aria-label="显示密码" data-icon="eye"></button></div></div>
          <button class="btn btn--primary btn--lg btn--block" type="submit">创建账号</button>
        </form>

        <form class="auth-form" id="resetForm" novalidate hidden>
          <div class="field"><label class="label" for="resetEmail">注册邮箱</label><input class="input" id="resetEmail" name="email" type="email" inputmode="email" autocomplete="email" required placeholder="输入注册时的邮箱"></div>
          <div class="field"><label class="label" for="resetCode">邮箱验证码</label><div class="input-group"><input class="input num" id="resetCode" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required placeholder="6 位数字"><button class="btn" type="button" data-send-code="reset">获取验证码</button></div></div>
          <div class="field"><label class="label" for="resetPassword">新密码</label><div class="password-wrap"><input class="input" id="resetPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="至少 8 位"><button type="button" data-toggle-password aria-label="显示密码" data-icon="eye"></button></div></div>
          <button class="btn btn--primary btn--lg btn--block" type="submit">重设密码</button>
          <button class="btn btn--ghost btn--block" type="button" data-mode="login">返回登录</button>
        </form>

        <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
        <p class="auth-foot">登录即表示同意社区服务规则　<a href="index.html">先逛逛</a></p>
      </div>
    </main>
  </div>

  <script src="api-config.js?v=20261022r2"></script>
  <script src="core.js?v=20261022r2"></script>
  <script src="daily-quote.js?v=20261022r2"></script>
  <script src="login.js?v=20261022r2"></script>
</body>
</html>
