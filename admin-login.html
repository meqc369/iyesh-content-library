<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#13213b">
  <title>后台登录 · 月入万刀</title>
  <link rel="icon" type="image/png" href="assets/iyesh-favicon.png">
  <link rel="stylesheet" href="styles.css?v=20261022r2">
</head>
<body data-page="admin-login" data-skip-me>
  <div class="auth-page">
    <section class="band auth-brand">
      <a class="brand" href="index.html" aria-label="返回月入万刀首页"><img src="assets/iyesh-logo.webp" alt="" width="32" height="32"><span>月入万刀</span></a>
      <div><h1>运营后台</h1><p class="motto" style="margin-top:14px">审核内容、管理会员与积分、处理提现。</p></div>
      <ul>
        <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span>按角色显示可用功能，所有操作写入审计日志</span></li>
        <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span>连续输错密码会被临时锁定</span></li>
      </ul>
    </section>
    <main class="auth-main">
      <div class="auth-card">
        <h2>管理员登录</h2>
        <p>请使用后台分配的管理员账号</p>
        <form class="auth-form" id="adminLoginForm" novalidate style="margin-top:24px">
          <div class="field"><label class="label" for="adminUsername">管理员账号</label><input class="input" id="adminUsername" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required placeholder="输入用户名"></div>
          <div class="field"><label class="label" for="adminPassword">密码</label><div class="password-wrap"><input class="input" id="adminPassword" name="password" type="password" autocomplete="current-password" required placeholder="输入密码"><button type="button" data-toggle-password aria-label="显示密码" data-icon="eye"></button></div></div>
          <label class="check"><input name="remember" type="checkbox" checked> 30 天内保持登录</label>
          <button class="btn btn--primary btn--lg btn--block" type="submit">进入后台</button>
        </form>
        <p class="auth-message" id="adminLoginMessage" role="status" aria-live="polite"></p>
        <p class="auth-foot"><a href="index.html">返回网站首页</a></p>
      </div>
    </main>
  </div>
  <script src="api-config.js?v=20261022r2"></script>
  <script src="core.js?v=20261022r2"></script>
  <script src="admin-login.js?v=20261022r2"></script>
</body>
</html>
