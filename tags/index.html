<script>
  // Resolve relative to the deployed static root so `/tags` also works when
  // the H5 bundle is mounted under a path such as `/content/`.
  const target = new URL('../index.html', location.href)
  target.search = location.search
  target.hash = location.hash
  location.replace(target.toString())
</script>
