<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#13213b">
  <meta name="format-detection" content="telephone=no">
  <title>会员中心 · 月入万刀</title>
  <meta name="description" content="开通月入万刀会员，解锁全部会员专享的 YouTube 实战打法和资料。">
  <link rel="icon" type="image/png" href="assets/iyesh-favicon.png">
  <link rel="preload" href="assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20261028r1">
</head>
<body data-page="membership">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="月入万刀首页"><img src="assets/iyesh-logo.webp" alt="" width="32" height="32"><span>月入万刀</span></a>
      <nav class="site-nav" aria-label="主导航"><a href="index.html" data-nav="discover">发现</a><a href="exploration.html" data-nav="exploration">赛道挖掘</a><a href="membership.html" data-nav="membership">会员中心</a><a href="profile.html" data-nav="profile">个人中心</a></nav>
      <div class="site-actions">
        <a class="btn btn--primary btn--sm hide-mobile" href="publish.html" data-icon="plus">发布内容</a>
        <a class="icon-btn hide-mobile" href="profile.html?tab=messages" aria-label="消息" data-icon="bell"><span class="dot-badge" data-unread hidden></span></a>
        <a class="account-link" href="login.html" data-account>登录</a>
      </div>
    </div>
  </header>

  <main class="page-main">
    <section class="band member-hero">
      <div class="container">
        <h1>开通会员，解锁全部会员专享打法</h1>
        <p>会员内容持续更新。用积分开通，有效期内不限次数阅读。</p>
        <div class="member-status" id="memberStatus">正在读取你的会员状态</div>
      </div>
    </section>

    <div class="container">
      <section class="plans" id="plans" aria-label="会员方案">
        <div class="sheet plan"><div class="skeleton" style="height:22px;width:40%"></div><div class="skeleton" style="height:44px;width:60%"></div><div class="skeleton" style="height:14px;width:80%"></div></div>
      </section>
      <div id="returnHint"></div>

      <div class="member-grid">
        <section class="sheet panel" id="redeem" aria-labelledby="redeemTitle">
          <div class="panel-head"><h2 id="redeemTitle">兑换码充值</h2><span class="tag tag--paid" id="balanceTag" hidden></span></div>
          <form class="input-group" id="redeemForm">
            <label class="sr-only" for="codeInput">兑换码</label>
            <input class="input num" id="codeInput" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="输入兑换码，例如 SC-XXXXX-XXXXXX" required>
            <button class="btn btn--money" type="submit">兑换</button>
          </form>
          <p class="hint" id="redeemMessage" style="margin-top:10px" role="status">兑换成功后积分立即到账，可用于开通会员、解锁内容和打赏。</p>
          <h3 style="margin:22px 0 6px;font-size:15px">兑换记录</h3>
          <div class="list" id="redeemList"><p class="hint">登录后查看兑换记录。</p></div>
        </section>

        <section class="sheet panel" aria-labelledby="howTitle">
          <div class="panel-head"><h2 id="howTitle">怎么获取积分</h2></div>
          <ol class="steps" id="steps">
            <li><span><strong>添加客服微信</strong><span id="contactLine">说明你想购买的积分数量。</span></span></li>
            <li><span><strong>付款后获得兑换码</strong><span id="offlineLine">客服确认收款后发给你一串兑换码。</span></span></li>
            <li><span><strong>在本页输入兑换码</strong>积分立即到账，随时开通会员。</span></li>
          </ol>
          <div class="contact" id="contact" style="margin-top:20px" hidden></div>
        </section>
      </div>
    </div>
  </main>

  <nav class="tabbar" aria-label="快捷导航">
    <a href="index.html" data-nav="discover" data-icon="discover"><span>发现</span></a>
    <a href="exploration.html" data-nav="exploration" data-icon="sparkle"><span>赛道</span></a>
    <a href="membership.html" data-nav="membership" data-icon="member"><span>会员</span></a>
    <a href="publish.html" class="tab-publish" aria-label="发布内容"><span class="plus" data-icon="plus"></span><small>发布</small></a>
    <a href="profile.html?tab=messages" data-nav="messages" data-icon="bell"><span>消息</span><span class="dot-badge" data-unread hidden></span></a>
    <a href="profile.html" data-nav="profile" data-icon="user"><span>我的</span></a>
  </nav>

  <script src="api-config.js?v=20261022r2"></script>
  <script src="core.js?v=20261028r1"></script>
  <script src="membership.js?v=20261022r2"></script>
</body>
</html>
