<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会员中心 · 月入万刀</title><link rel="icon" type="image/png" href="assets/iyesh-favicon.png">
  <link rel="stylesheet" href="styles.css">
<style>
  .membership-page{--member-ink:#172b4d;--member-muted:#66758c;--member-accent:#315ddd;background:#f5f7fb;overflow-x:hidden}
  .membership-page .membership-shell{width:min(100%,1040px);max-width:none;padding-top:34px}
  .membership-page .hero{align-items:center;margin-bottom:20px}
  .membership-page .hero h1{color:var(--member-ink);font-size:34px;letter-spacing:-.03em}
  .membership-page .member-status{border:1px solid #dce5f7;border-radius:999px;background:#f3f6ff;color:#315ddd;padding:9px 13px;white-space:nowrap}
  .membership-page .plans{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
  .membership-page .plan-card{position:relative;gap:9px;border-color:#e1e7f0;border-radius:16px;padding:20px;background:#fff;box-shadow:0 7px 20px rgba(31,53,92,.045)}
  .membership-page .plan-card:before{content:"";position:absolute;inset:0 0 auto;height:3px;border-radius:16px 16px 0 0;background:#315ddd}
  .membership-page .plan-card h2{color:var(--member-ink);font-size:18px}
  .membership-page .plan-card p{color:var(--member-muted);min-height:0;line-height:1.55}
  .membership-page .plan-card strong{color:var(--member-ink);font-size:24px;line-height:1.25}
  .membership-page .plan-card small{color:#7b899e}
  .membership-page .plan-card button{background:var(--member-accent);border-radius:9px;box-shadow:0 7px 14px rgba(49,93,221,.15)}
  .membership-page .plan-card button:hover{background:#284fc5}
  .membership-page .plan-card .offline-action{background:#fff4df;border:1px solid #f0d8a7;color:#8a5a00;box-shadow:none}
  .membership-page .detail-card{border-color:#e1e7f0;border-radius:16px;padding:20px;box-shadow:0 7px 20px rgba(31,53,92,.045)}
  .membership-page .detail-card h2{color:var(--member-ink)}
  .membership-page .point-unit-badge{background:#eef2ff;color:var(--member-accent)}
  .membership-page .purchase-guide{padding:14px 0;gap:16px}
  .membership-page .purchase-guide img{width:132px;height:132px;border-radius:12px;border-color:#e1e7f0}
  .membership-page .purchase-guide-copy strong{color:var(--member-ink)}
  .membership-page .purchase-guide-copy span{color:var(--member-muted);line-height:1.5}
  .membership-page .purchase-guide-copy a{color:var(--member-accent)}
  .membership-page .redeem-form{border-color:#ebeff5}
  .membership-page .redeem-form input{border-color:#dbe3ee;background:#fbfcff;min-width:0}
  .membership-page .redeem-form input:focus{border-color:#6d8af0;box-shadow:0 0 0 3px rgba(49,93,221,.12);outline:0}
  .membership-page .redeem-form button{background:var(--member-accent);border-radius:9px}
  .membership-page .offline-card{padding:17px 20px;border-color:#e1e7f0}
  .membership-page .offline-icon{width:68px;height:50px;border-radius:12px;background:#fff4df;color:#8a5a00}
  .membership-page .offline-card h2{color:var(--member-ink)}
  .membership-page .offline-card p{color:var(--member-muted)}
  .membership-page .orders-card{margin-bottom:0}
  .membership-page .order-row{border-color:#ebeff5;color:#324966}
  .membership-page .order-status{color:var(--member-muted)}
  @media(max-width:760px){
    .membership-page .membership-shell{padding:24px 14px 46px}
    .membership-page .hero{align-items:flex-start;gap:10px}
    .membership-page .hero h1{font-size:29px}
    .membership-page .member-status{font-size:12px;padding:8px 10px}
    .membership-page .plans{grid-template-columns:1fr;gap:11px}
    .membership-page .plan-card{padding:18px 16px}
    .membership-page .detail-card{padding:17px 14px;border-radius:14px}
    .membership-page .purchase-guide{align-items:flex-start;flex-direction:row}
    .membership-page .purchase-guide img{width:100px;height:100px}
    .membership-page .purchase-guide-copy{min-width:0}
    .membership-page .redeem-form{flex-direction:column;gap:9px}
    .membership-page .redeem-form button{height:42px}
    .membership-page .offline-card{align-items:flex-start;gap:11px}
    .membership-page .offline-icon{width:58px;height:46px}
  }
  @media(max-width:390px){
    .membership-page .membership-shell{padding-inline:10px}
    .membership-page .hero{display:flex;flex-direction:column}
    .membership-page .member-status{width:100%;border-radius:10px}
    .membership-page .purchase-guide{flex-direction:column}
    .membership-page .purchase-guide img{width:116px;height:116px}
    .membership-page .order-row{grid-template-columns:minmax(0,1fr) auto;font-size:12px}
    .membership-page .order-row>span:nth-child(2){display:none}
  }
</style>
</head>
<body class="membership-page"><header class="topbar"><div class="brand"><img class="brand-logo" src="assets/iyesh-logo.webp" alt=""><span>月入万刀</span></div><nav class="primary-nav" aria-label="主导航"><a href="index.html">首页</a><a href="index.html">内容检索</a><a href="publish.html">发布内容</a><a class="active">会员中心</a></nav><div class="top-actions"><a class="avatar" href="profile.html" aria-label="个人中心">林</a></div></header><main class="shell membership-shell"><section class="hero"><div><h1>会员中心</h1></div><div><div id="memberStatus" class="member-status">正在加载…</div></div></section><section id="plans" class="plans"><p class="sub">正在加载会员等级…</p></section><section class="detail-card purchase-card"><div class="detail-head"><div><h2>购买积分 / 兑换码</h2></div><span id="purchaseUnit" class="point-unit-badge">积分</span></div><div id="purchaseGuide" class="purchase-guide"><p class="sub">正在加载购买方式…</p></div><form id="cdkeyRedeemForm" class="redeem-form"><label class="sr-only" for="cdkeyInput">积分兑换码</label><input id="cdkeyInput" name="code" autocomplete="off" placeholder="输入兑换码，例如 SC-XXXXX-XXXXXX-XXXXXX" required><button type="submit">兑换积分</button></form><p id="redeemMessage" class="sub"></p></section><section class="detail-card offline-card"><div class="offline-icon" id="offlineIcon">线下开通</div><div><h2 id="offlineTitle">线下开通</h2><p id="offlineNote">联系管理员完成收款，确认后立即生效。</p></div></section><section class="detail-card orders-card"><div class="detail-head"><h2>最近订单</h2><span id="orderMessage" class="sub"></span></div><div id="orders"><p class="sub">登录后查看订单。</p></div></section></main><div id="toast" class="toast"></div><script src="api-config.js?v=20261016api2"></script><script src="membership.js?v=20261016ui"></script>  <script src="nav.js"></script>
</body></html>
