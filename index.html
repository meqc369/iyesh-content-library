<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>内容检索 · 月入万刀</title>
  <link rel="icon" type="image/png" href="assets/iyesh-favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="assets/iyesh-logo.webp" alt=""><span>月入万刀</span></div>
    <nav class="primary-nav" aria-label="主导航"><a href="index.html">首页</a><a class="active">内容检索</a><a href="publish.html">发布内容</a><a href="membership.html">会员中心</a></nav>
    <div class="top-actions"><label class="global-search"><span>⌕</span><input id="keywordInput" type="search" placeholder="搜索标题、作者、标签" aria-label="搜索标题、作者、标签"></label><a id="profileLink" class="avatar" href="profile.html" aria-label="个人中心">林</a></div>
  </header>

  <main class="shell">
    <section class="hero">
      <div><h1>内容检索</h1></div>
      <aside class="daily-quote" data-daily-quote aria-label="每日一语"><span class="daily-quote-mark" aria-hidden="true">“</span><div class="daily-quote-content"><span class="daily-quote-label">每日一语</span><span class="daily-quote-text" data-quote-text>把复杂的事做简单，行动会带来答案。</span></div></aside><div class="hero-stat"><strong id="resultCount">1582</strong><span>篇相关内容</span></div>
    </section>

    <section class="filters" aria-label="筛选条件">
      <div class="filter-head"><div class="filter-title">筛选条件</div><div><button id="saveFilterBtn" class="save-btn">＋ 存为常用</button><button id="resetBtn" class="reset">清除筛选</button></div></div>
      <div class="filter-summary"><span>共 <strong id="summaryCount">1582</strong> 篇相关内容</span><span id="activeSummary" class="active-summary">YouTube</span></div>
    </section>

    <section class="content-toolbar">
      <div class="tabs" data-group="tab"><button class="tab selected" data-value="hot">热门 <span id="hotCount">1582</span></button><button class="tab" data-value="digest">精华 <span id="digestCount">210</span></button><button class="tab" data-value="all">全部 <span>—</span></button></div>
      <div class="toolbar-right"><label class="select-wrap">日期<select id="dateSelect"><option value="all">不限</option><option value="yesterday">昨天</option><option value="3d">近3天</option><option value="7d">近7天</option><option value="month">近一月</option><option value="last-month">上月</option><option value="3month">近三月</option></select></label><label class="select-wrap">排序<select id="sortSelect"><option value="latest">最新发布</option><option value="oldest">最早发布</option><option value="favorites">最多收藏</option><option value="comments">最多评论</option><option value="likes">最多点赞</option><option value="anchors">最多锚点</option><option value="anchor-latest">最新投锚</option></select></label><label class="select-wrap">阅读<select id="modeSelect"><option value="normal">常规</option><option value="compact">简洁</option><option value="streamline">精简</option></select></label></div>
    </section>

    <div class="layout"><section id="cards" class="cards"></section><aside class="sidebar"><div class="side-card"><div class="side-head"><h2>我的常用 <span id="savedCount">0/7</span></h2><button id="clearSaved" class="link-btn">清空</button></div><div id="savedFilters" class="saved-list"><span class="empty">暂无常用筛选</span></div></div></aside></div>
    <button id="loadMoreBtn" class="load-more" hidden>加载更多</button>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="api-config.js?v=20261016api2"></script><script src="daily-quote.js"></script><script src="share.js?v=20261017platform"></script><script src="app.js?v=20261017youtube"></script>
  <script src="nav.js"></script>
</body>
</html>
