<body data-page="discover">
  <a class="sr-only" href="#feed">跳到内容列表</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="月入万刀首页"><img src="assets/iyesh-logo.webp" alt="" width="32" height="32"><span>月入万刀</span></a>
      <nav class="site-nav" aria-label="主导航"><a href="index.html" data-nav="discover">发现</a><a href="exploration.html" data-nav="exploration">赛道挖掘</a><a href="membership.html" data-nav="membership">会员中心</a><a href="profile.html" data-nav="profile">个人中心</a></nav>
      <div class="site-actions">
        <a class="btn btn--primary btn--sm hide-mobile" href="publish.html" data-icon="plus">发布内容</a>
        <a class="icon-btn hide-mobile" href="profile.html#messages" aria-label="消息" data-icon="bell"><span class="dot-badge" data-unread hidden></span></a>
        <a class="account-link" href="login.html" data-account>登录</a>
      </div>
    </div>
  </header>

  <main class="page-main">
    <section class="band discover-hero">
      <div class="container">
        <p class="motto" data-daily-quote><span data-quote-text>把复杂的事做简单，行动会带来答案。</span></p>
        <h1><span class="phrase">找到下一条能直接复制的</span> <span class="phrase">YouTube 赚钱打法</span></h1>
        <form class="hero-search" id="searchForm" role="search">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="keywordInput" type="search" enterkeyhint="search" autocomplete="off" placeholder="搜索标题、作者或关键词" aria-label="搜索内容">
          <button class="clear" type="button" id="clearKeyword" aria-label="清除搜索词" data-icon="x"></button>
          <button class="btn btn--primary btn--sm" type="submit">搜索</button>
        </form>
        <div class="hero-quick"><span>热门方向</span><div class="chip-scroll" id="quickTopics"></div></div>
        <p class="hero-count" id="heroCount">正在整理内容</p>
      </div>
    </section>

    <div class="filterbar" id="filterbar">
      <div class="container filterbar__inner">
        <div class="segmented" role="tablist" aria-label="内容范围" id="tabs">
          <button type="button" role="tab" data-tab="hot">推荐</button>
          <button type="button" role="tab" data-tab="latest">最新</button>
          <button type="button" role="tab" data-tab="digest">精华</button>
        </div>
        <div class="filterbar__right">
          <div class="view-toggle hide-mobile" role="group" aria-label="阅读模式">
            <button type="button" data-mode="normal" aria-label="常规模式" data-icon="cards"></button>
            <button type="button" data-mode="compact" aria-label="精简模式" data-icon="rows"></button>
          </div>
          <button class="btn btn--sm filter-toggle" type="button" id="openFilters" data-icon="sliders">筛选<span class="count" id="filterCount" hidden></span></button>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="active-filters" id="activeFilters" hidden></div>
      <div class="discover-layout">
        <section aria-label="内容列表">
          <div class="feed" id="feed" aria-busy="true"></div>
        </section>
        <aside class="side-stack" aria-label="快捷入口">
          <section class="sheet side-card">
            <div class="panel-head" style="margin-bottom:0"><h3>我的常用筛选</h3><span class="hint num" id="savedCount"></span></div>
            <div class="saved-list" id="savedFilters"><p class="hint">登录后可以保存最多 7 组筛选，下次一键打开。</p></div>
          </section>
          <section class="note promo-note">
            <h3>会员内容每周更新</h3>
            <p>用积分开通会员，解锁全部会员专享打法和资料包。</p>
            <a class="btn btn--money btn--sm" href="membership.html">查看会员方案</a>
          </section>
          <section class="sheet write-card">
            <h3>有一套跑通的打法？</h3>
            <p>写下来分享给同行，审核通过后公开，还能收到积分打赏。</p>
            <a class="btn btn--sm" href="publish.html" data-icon="edit">写一篇</a>
          </section>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="container"><span>© 月入万刀 · 实战内容与会员权益平台</span><span><a href="membership.html">会员中心</a>　<a href="publish.html">投稿</a></span></div></footer>
