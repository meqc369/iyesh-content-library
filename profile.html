<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="format-detection" content="telephone=no">
  <title>个人中心 · 月入万刀</title>
  <link rel="icon" type="image/png" href="assets/iyesh-favicon.png">
  <link rel="preload" href="assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20261028r1">
</head>
<body data-page="profile">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="月入万刀首页"><img src="assets/iyesh-logo.webp" alt="" width="32" height="32"><span>月入万刀</span></a>
      <nav class="site-nav" aria-label="主导航"><a href="index.html" data-nav="discover">发现</a><a href="exploration.html" data-nav="exploration">赛道挖掘</a><a href="membership.html" data-nav="membership">会员中心</a><a href="profile.html" data-nav="profile">个人中心</a></nav>
      <div class="site-actions">
        <a class="btn btn--primary btn--sm hide-mobile" href="publish.html" data-icon="plus">发布内容</a>
        <a class="icon-btn hide-mobile" href="profile.html?tab=messages" aria-label="消息" data-icon="bell"><span class="dot-badge" data-unread hidden></span></a>
        <a class="account-link" href="login.html" data-account>登录</a>
      </div>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <section class="sheet gate" id="gate" hidden>
        <svg class="icon" viewBox="0 0 24 24" style="width:40px;height:40px;color:var(--cobalt)" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <h1>登录后查看个人中心</h1>
        <p>你的投稿、收藏、积分和会员都在这里。</p>
        <a class="btn btn--primary" id="gateLogin" href="login.html">登录 / 注册</a>
      </section>
    </div>

    <div id="profile" hidden>
      <section class="container profile-head">
        <div class="identity" id="identity">
          <span class="avatar skeleton" style="--size:68px"></span>
          <div><div class="skeleton" style="height:24px;width:40%"></div><div class="skeleton" style="height:14px;width:60%;margin-top:10px"></div></div>
        </div>
        <div class="wallet">
          <section class="note wallet-note" id="walletNote" aria-label="积分余额">
            <span class="label" id="walletLabel">积分余额</span>
            <div class="face num" id="walletBalance">—</div>
            <div class="actions">
              <a class="btn btn--money" href="membership.html#redeem" data-icon="gift">兑换码充值</a>
              <button class="btn" type="button" data-open-tab="wallet" data-icon="wallet">明细与提现</button>
            </div>
          </section>
          <section class="note note--seal member-card" id="memberCard"></section>
        </div>
        <section class="sheet checkin-strip" id="checkin" hidden></section>
      </section>

      <nav class="profile-tabs" aria-label="个人中心">
        <div class="container" role="tablist">
          <button type="button" role="tab" data-tab="posts">我的投稿</button>
          <button type="button" role="tab" data-tab="favorites">收藏</button>
          <button type="button" role="tab" data-tab="messages">消息<span class="dot-badge" data-unread hidden></span></button>
          <button type="button" role="tab" data-tab="wallet">钱包</button>
          <button type="button" role="tab" data-tab="invite">邀请好友</button>
          <button type="button" role="tab" data-tab="filters">常用筛选</button>
        </div>
      </nav>

      <div class="container profile-panels">
        <section data-panel="posts" role="tabpanel" hidden>
          <div class="sheet panel">
            <div class="panel-head"><h2>我的投稿</h2><a class="btn btn--primary btn--sm" href="publish.html" data-icon="plus">写一篇</a></div>
            <div class="segmented" role="group" aria-label="投稿状态" id="postFilter" style="margin-bottom:6px;max-width:100%;overflow-x:auto">
              <button type="button" data-status="" aria-pressed="true">全部</button><button type="button" data-status="draft" aria-pressed="false">草稿</button><button type="button" data-status="pending" aria-pressed="false">审核中</button><button type="button" data-status="published" aria-pressed="false">已发布</button><button type="button" data-status="rejected" aria-pressed="false">未通过</button>
            </div>
            <div class="list" id="postList"></div>
          </div>
        </section>

        <section data-panel="favorites" role="tabpanel" hidden>
          <div class="sheet panel">
            <div class="panel-head"><h2>我标记的内容</h2>
              <div class="segmented" role="group" aria-label="类型" id="markFilter"><button type="button" data-type="favorite" aria-pressed="true">收藏</button><button type="button" data-type="like" aria-pressed="false">点赞</button><button type="button" data-type="anchor" aria-pressed="false">投锚</button></div>
            </div>
            <div class="list" id="markList"></div>
          </div>
        </section>

        <section data-panel="messages" role="tabpanel" hidden>
          <div class="sheet panel">
            <div class="panel-head"><h2>消息</h2><button class="text-btn" type="button" id="readAll">全部标为已读</button></div>
            <div class="list" id="messageList"></div>
            <div style="display:flex;justify-content:center;padding-top:12px"><button class="btn btn--sm" type="button" id="moreMessages" hidden>加载更多</button></div>
          </div>
        </section>

        <section data-panel="wallet" role="tabpanel" hidden>
          <div class="grid-2">
            <div class="sheet panel">
              <div class="panel-head"><h2>积分明细</h2></div>
              <div class="list" id="ledgerList"></div>
              <div style="display:flex;justify-content:center;padding-top:12px"><button class="btn btn--sm" type="button" id="moreLedger" hidden>加载更多</button></div>
            </div>
            <div class="sheet panel" id="withdrawPanel">
              <div class="panel-head"><h2>提现</h2><span class="hint" id="withdrawRate"></span></div>
              <form class="form-grid" id="withdrawForm" novalidate>
                <div class="field"><span class="label">收款方式</span><div class="segmented" role="group" id="withdrawMethod"><button type="button" data-method="alipay" aria-pressed="true">支付宝</button><button type="button" data-method="wechat" aria-pressed="false">微信</button></div></div>
                <label class="qr-upload" for="withdrawQr"><span class="placeholder" id="qrPreview" data-icon="qr"></span><span><strong>上传收款码</strong><br><span class="hint">截图你的支付宝或微信收款码</span></span><input id="withdrawQr" type="file" accept="image/*" hidden></label>
                <div class="field"><label class="label" for="withdrawPoints">提现数量 <small id="withdrawAvailable"></small></label><input class="input num" id="withdrawPoints" type="number" inputmode="numeric" min="1" step="1" placeholder="输入积分数量"></div>
                <div class="field"><label class="label" for="withdrawPhone">联系手机</label><input class="input" id="withdrawPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="11" placeholder="打款有问题时联系你"></div>
                <div class="withdraw-estimate"><div><span>预计到账</span><strong id="estNet">¥0.00</strong></div><div><span id="estFeeLabel">手续费</span><strong id="estFee">¥0.00</strong></div><div><span>兑换</span><strong id="estGross">¥0.00</strong></div></div>
                <p class="field-error" id="withdrawError" hidden></p>
                <button class="btn btn--money" type="submit">提交提现申请</button>
              </form>
              <h3 style="margin:22px 0 4px;font-size:15px">提现记录</h3>
              <div class="list" id="withdrawList"></div>
            </div>
          </div>
          <div class="sheet panel" style="margin-top:16px">
            <div class="panel-head"><h2>订单与打赏</h2></div>
            <div class="list" id="orderList"></div>
          </div>
        </section>

        <section data-panel="invite" role="tabpanel" hidden>
          <div class="sheet panel">
            <div class="panel-head"><h2>邀请好友</h2><span class="tag tag--paid" id="inviteRate"></span></div>
            <div class="invite-layout">
              <div>
                <p class="hint" id="inviteRule">好友通过你的链接注册后成为你的直属好友，他充值或兑换会员时你获得积分提成。</p>
                <div class="invite-link" style="margin-top:14px"><input class="input" id="inviteUrl" readonly aria-label="专属邀请链接"><button class="btn" type="button" id="copyInvite" data-icon="copy">复制</button></div>
                <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button class="btn btn--primary" type="button" id="invitePoster" data-icon="image">生成邀请海报</button></div>
              </div>
              <div id="inviteQr" class="invite-qr" aria-label="邀请二维码"></div>
            </div>
            <div class="stat-row" style="margin-top:20px"><div><strong id="inviteCount">0</strong><span>直属好友</span></div><div><strong id="inviteTotal">0</strong><span>累计提成</span></div><div><strong id="invitePending">0</strong><span>待结算</span></div></div>
            <h3 style="margin:8px 0 4px;font-size:15px">提成记录</h3>
            <div class="list" id="inviteList"></div>
          </div>
        </section>

        <section data-panel="filters" role="tabpanel" hidden>
          <div class="sheet panel">
            <div class="panel-head"><h2>常用筛选</h2><a class="text-btn" href="index.html">去发现页设置</a></div>
            <div class="list" id="filterList"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <nav class="tabbar" aria-label="快捷导航">
    <a href="index.html" data-nav="discover" data-icon="discover"><span>发现</span></a>
    <a href="exploration.html" data-nav="exploration" data-icon="sparkle"><span>赛道</span></a>
    <a href="membership.html" data-nav="membership" data-icon="member"><span>会员</span></a>
    <a href="publish.html" class="tab-publish" aria-label="发布内容"><span class="plus" data-icon="plus"></span><small>发布</small></a>
    <a href="profile.html?tab=messages" data-nav="messages" data-icon="bell"><span>消息</span><span class="dot-badge" data-unread hidden></span></a>
    <a href="profile.html" data-nav="profile" data-icon="user"><span>我的</span></a>
  </nav>

  <script src="api-config.js?v=20261022r2"></script>
  <script src="core.js?v=20261028r1"></script>
  <script src="assets/vendor/qrcode.js?v=20261022r2"></script>
  <script src="share.js?v=20261028r1"></script>
  <script src="profile.js?v=20261022r2"></script>
</body>
</html>
